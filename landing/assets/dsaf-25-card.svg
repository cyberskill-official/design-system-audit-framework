<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" role="img" aria-labelledby="title desc">
  <title id="title">DSAF-25 Core one-page card</title>
  <desc id="desc">A printable list of 25 core design-system audit criteria across system and UX categories.</desc>
  <rect width="210" height="297" fill="#fbfaf7"/>
  <rect x="10" y="10" width="190" height="277" fill="#ffffff" stroke="#1f2a44" stroke-width="0.6"/>
  <text x="16" y="24" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#1f2a44">DSAF-25 Core</text>
  <text x="16" y="33" font-family="Inter, Arial, sans-serif" font-size="4.2" fill="#40516f">Score each row 0-5. Sum / 125 * 100. First pass, not a substitute for the full DSAF Criteria.</text>
  <line x1="16" y1="39" x2="194" y2="39" stroke="#d28b00" stroke-width="0.8"/>
  <text x="16" y="48" font-family="Inter, Arial, sans-serif" font-size="5.2" font-weight="700" fill="#1f2a44">Part A: System</text>
  <text x="16" y="57" font-family="Inter, Arial, sans-serif" font-size="3.8" fill="#1f2a44">1 A1.1 Color tokens with primitive to semantic to component layers</text>
  <text x="16" y="65" font-family="Inter, Arial, sans-serif" font-size="3.8" fill="#1f2a44">2 A1.8 Token format and DTCG conformance</text>
  <text x="16" y="73" font-family="Inter, Arial, sans-serif" font-size="3.8" fill="#1f2a44">3 A1.9 Modern color spaces</text>
  <text x="16" y="81" font-family="Inter, Arial, sans-serif" font-size="3.8" fill="#1f2a44">4 A2.1 Coverage of Top 20 components</text>
  <text x="16" y="89" font-family="Inter, Arial, sans-serif" font-size="3.8" fill="#1f2a44">5 A2.4 Variant and state coverage</text>
  <text x="16" y="97" font-family="Inter, Arial, sans-serif" font-size="3.8" fill="#1f2a44">6 A3.1 Usage guidelines per component</text>
  <text x="16" y="105" font-family="Inter, Arial, sans-serif" font-size="3.8" fill="#1f2a44">7 A4.2 RFC process</text>
  <text x="16" y="113" font-family="Inter, Arial, sans-serif" font-size="3.8" fill="#1f2a44">8 A4.3 Semver discipline</text>
  <text x="16" y="121" font-family="Inter, Arial, sans-serif" font-size="3.8" fill="#1f2a44">9 A5.4 Storybook or equivalent</text>
  <text x="16" y="129" font-family="Inter, Arial, sans-serif" font-size="3.8" fill="#1f2a44">10 A5.5 CI/CD for the system itself</text>
  <text x="16" y="137" font-family="Inter, Arial, sans-serif" font-size="3.8" fill="#1f2a44">11 A6.1 Light and dark mode parity</text>
  <text x="16" y="145" font-family="Inter, Arial, sans-serif" font-size="3.8" fill="#1f2a44">12 A7.1 Coverage percentage</text>
  <text x="16" y="153" font-family="Inter, Arial, sans-serif" font-size="3.8" fill="#1f2a44">13 A8.1 Contrast guarantees</text>
  <text x="16" y="161" font-family="Inter, Arial, sans-serif" font-size="3.8" fill="#1f2a44">14 A9.1 Bundle size budgets</text>
  <text x="16" y="169" font-family="Inter, Arial, sans-serif" font-size="3.8" fill="#1f2a44">15 A10.3 AI-rules file for agents</text>
  <text x="16" y="183" font-family="Inter, Arial, sans-serif" font-size="5.2" font-weight="700" fill="#1f2a44">Part B: UX</text>
  <text x="16" y="192" font-family="Inter, Arial, sans-serif" font-size="3.8" fill="#1f2a44">16 B1.1 Method diversity</text>
  <text x="16" y="200" font-family="Inter, Arial, sans-serif" font-size="3.8" fill="#1f2a44">17 B2.1 Match between system and user mental model</text>
  <text x="16" y="208" font-family="Inter, Arial, sans-serif" font-size="3.8" fill="#1f2a44">18 B3.3 Error prevention and recovery</text>
  <text x="16" y="216" font-family="Inter, Arial, sans-serif" font-size="3.8" fill="#1f2a44">19 B4.1 Visual hierarchy</text>
  <text x="16" y="224" font-family="Inter, Arial, sans-serif" font-size="3.8" fill="#1f2a44">20 B5.2 WCAG 2.2 Level AA conformance</text>
  <text x="16" y="232" font-family="Inter, Arial, sans-serif" font-size="3.8" fill="#1f2a44">21 B6.1 Voice and tone documentation</text>
  <text x="16" y="240" font-family="Inter, Arial, sans-serif" font-size="3.8" fill="#1f2a44">22 B7.1 Heuristic evaluation cadence</text>
  <text x="16" y="248" font-family="Inter, Arial, sans-serif" font-size="3.8" fill="#1f2a44">23 B8.1 LCP at 75th percentile</text>
  <text x="16" y="256" font-family="Inter, Arial, sans-serif" font-size="3.8" fill="#1f2a44">24 B9.1 No-dark-pattern guarantee</text>
  <text x="16" y="264" font-family="Inter, Arial, sans-serif" font-size="3.8" fill="#1f2a44">25 B10.1 HEART framework adoption</text>
  <text x="16" y="279" font-family="Inter, Arial, sans-serif" font-size="3.6" fill="#40516f">Full rubric: docs/03-criteria-part-a.md + docs/04-criteria-part-b.md. Public card: audit.cyberskill.world/card.</text>
</svg>
