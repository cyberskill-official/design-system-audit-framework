<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" role="img" aria-labelledby="ladder-title ladder-desc">
  <title id="ladder-title">DSAF L0-L5 Maturity Ladder</title>
  <desc id="ladder-desc">A dark-mode six-tier DSAF maturity ladder with score ranges, meanings, and transition gates from L0 Initial through L5 Optimised.</desc>
  <metadata>{"dsaf_125_version":"2026-05-18","dsaf_25_version":"2026-05-18","task":"TASK-BRAND-003","source":"https://audit.cyberskill.world/assets/dsaf-l0-l5-ladder-dark.svg"}</metadata>
  <rect width="210" height="297" fill="#0f172a"/>
  <text x="14" y="18" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#f8fafc">DSAF L0-L5 Maturity Ladder</text>
  <text x="14" y="27" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="4.5" fill="#cbd5e1">Score bands describe maturity; gates describe</text>
  <text x="14" y="33" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="4.5" fill="#cbd5e1">what must be true before a public claim rises.</text>
  <g font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <g transform="translate(14 244)"><rect width="182" height="29" rx="3" fill="#1e293b" stroke="#334155"/><rect width="34" height="29" rx="3" fill="#334155"/><text x="7" y="11" font-size="6.5" font-weight="700" fill="#f8fafc">L0</text><text x="7" y="20" font-size="4.4" fill="#cbd5e1">Initial</text><text x="42" y="10" font-size="5.2" font-weight="700" fill="#f8fafc">&lt; 40%</text><text x="42" y="18" font-size="4.3" fill="#cbd5e1">Mostly absent; work is ad hoc.</text><text x="42" y="25" font-size="3.8" fill="#94a3b8">Gate to L1: repeatable evidence in multiple categories.</text></g>
    <g transform="translate(14 208)"><rect width="182" height="29" rx="3" fill="#172554" stroke="#1d4ed8"/><rect width="48" height="29" rx="3" fill="#1e40af"/><text x="7" y="11" font-size="6.5" font-weight="700" fill="#f8fafc">L1</text><text x="7" y="20" font-size="4.4" fill="#dbeafe">Repeatable</text><text x="56" y="10" font-size="5.2" font-weight="700" fill="#f8fafc">40-55%</text><text x="56" y="18" font-size="4.3" fill="#dbeafe">Some patterns repeat; governance is light.</text><text x="56" y="25" font-size="3.8" fill="#93c5fd">Gate to L2: documented process and owned criteria.</text></g>
    <g transform="translate(14 172)"><rect width="182" height="29" rx="3" fill="#052e2b" stroke="#0f766e"/><rect width="62" height="29" rx="3" fill="#0f766e"/><text x="7" y="11" font-size="6.5" font-weight="700" fill="#f8fafc">L2</text><text x="7" y="20" font-size="4.4" fill="#ccfbf1">Defined</text><text x="70" y="10" font-size="5.2" font-weight="700" fill="#f8fafc">55-65%</text><text x="70" y="18" font-size="4.3" fill="#ccfbf1">Rubric exists; teams can run the audit.</text><text x="70" y="25" font-size="3.8" fill="#5eead4">Gate to L3: measured, signed audit trail.</text></g>
    <g transform="translate(14 136)"><rect width="182" height="29" rx="3" fill="#042f2e" stroke="#14b8a6"/><rect width="78" height="29" rx="3" fill="#0d9488"/><text x="7" y="11" font-size="6.5" font-weight="700" fill="#f8fafc">L3</text><text x="7" y="20" font-size="4.4" fill="#ccfbf1">Managed</text><text x="86" y="10" font-size="5.2" font-weight="700" fill="#f8fafc">65-75%</text><text x="86" y="18" font-size="4.3" fill="#ccfbf1">Evidence-backed; public self-audit cap.</text><text x="86" y="25" font-size="3.8" fill="#5eead4">Gate to L4: third-party verification.</text></g>
    <g transform="translate(14 100)"><rect width="182" height="29" rx="3" fill="#451a03" stroke="#b45309"/><rect width="96" height="29" rx="3" fill="#92400e"/><text x="7" y="11" font-size="6.5" font-weight="700" fill="#f8fafc">L4</text><text x="7" y="20" font-size="4.4" fill="#fde68a">Managed-advanced</text><text x="104" y="10" font-size="5.2" font-weight="700" fill="#f8fafc">75-85%</text><text x="104" y="18" font-size="4.3" fill="#fde68a">External review; enterprise gates hold.</text><text x="104" y="25" font-size="3.8" fill="#fbbf24">Gate to L5: repeated audits and ecosystem proof.</text></g>
    <g transform="translate(14 64)"><rect width="182" height="29" rx="3" fill="#431407" stroke="#fb923c"/><rect width="116" height="29" rx="3" fill="#ea580c"/><text x="7" y="11" font-size="6.5" font-weight="700" fill="#f8fafc">L5</text><text x="7" y="20" font-size="4.4" fill="#ffedd5">Optimised</text><text x="124" y="10" font-size="5.2" font-weight="700" fill="#f8fafc">85%+</text><text x="124" y="18" font-size="4.3" fill="#ffedd5">Verified, resilient, externally proven.</text><text x="124" y="25" font-size="3.8" fill="#fdba74">Gate stays high: no self-attested L5.</text></g>
  </g>
  <path d="M105 228L105 203M105 192L105 167M105 156L105 131M105 120L105 95" stroke="#64748b" stroke-width=".9" stroke-dasharray="2 2"/>
  <text x="14" y="287" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="3.8" fill="#94a3b8">DSAF v1, 2026-05-18 - audit.cyberskill.world - self-audits cite L3 max until third-party verification.</text>
