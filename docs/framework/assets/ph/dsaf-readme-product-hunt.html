<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSAF README Product Hunt preview</title>
  <style>
    body { margin: 0; width: 1200px; height: 750px; background: #0f172a; color: #f8fafc; font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif; }
    main { box-sizing: border-box; width: 100%; height: 100%; padding: 46px 56px; display: grid; grid-template-columns: 1.02fr .98fr; gap: 42px; align-items: center; }
    .eyebrow { color: #93c5fd; font-weight: 800; font-size: 22px; margin-bottom: 18px; }
    h1 { margin: 0 0 22px; font-size: 58px; line-height: 1; letter-spacing: 0; }
    p { margin: 0 0 22px; color: #cbd5e1; font-size: 23px; line-height: 1.35; }
    .visuals { display: grid; gap: 18px; }
    .visual { background: #ffffff; border: 1px solid #cbd5e1; padding: 14px; }
    .visual img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <main>
    <section>
      <div class="eyebrow">README first-screen promise</div>
      <h1>Design-system audits without taste arguments</h1>
      <p>DSAF is an open, criteria-graded way to inspect design-system maturity and the UX it produces.</p>
    </section>
    <section class="visuals">
      <div class="visual"><img src="../dsaf-l0-l5-ladder.svg" alt="DSAF L0-L5 ladder"></div>
      <div class="visual"><img src="../dsaf-radar.svg" alt="DSAF radar"></div>
    </section>
  </main>
</body>
</html>
