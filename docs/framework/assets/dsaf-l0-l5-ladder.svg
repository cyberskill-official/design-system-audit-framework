<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" role="img" aria-labelledby="ladder-title ladder-desc">
  <title id="ladder-title">DSAF L0-L5 Maturity Ladder</title>
  <desc id="ladder-desc">A six-tier DSAF maturity ladder with score ranges, meanings, and transition gates from L0 Initial through L5 Optimised.</desc>
  <metadata>{"dsaf_125_version":"2026-05-18","dsaf_25_version":"2026-05-18","task":"TASK-BRAND-003","source":"https://audit.cyberskill.world/assets/dsaf-l0-l5-ladder.svg"}</metadata>
  <rect width="210" height="297" fill="#fff"/>
  <text x="14" y="18" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#111827">DSAF L0-L5 Maturity Ladder</text>
  <text x="14" y="27" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="4.5" fill="#4b5563">Score bands describe maturity; gates describe</text>
  <text x="14" y="33" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="4.5" fill="#4b5563">what must be true before a public claim rises.</text>
  <g font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <g transform="translate(14 244)"><rect width="182" height="29" rx="3" fill="#f3f4f6" stroke="#d1d5db"/><rect width="34" height="29" rx="3" fill="#e5e7eb"/><text x="7" y="11" font-size="6.5" font-weight="700" fill="#111827">L0</text><text x="7" y="20" font-size="4.4" fill="#374151">Initial</text><text x="42" y="10" font-size="5.2" font-weight="700" fill="#111827">&lt; 40%</text><text x="42" y="18" font-size="4.3" fill="#374151">Mostly absent; work is ad hoc.</text><text x="42" y="25" font-size="3.8" fill="#6b7280">Gate to L1: repeatable evidence in multiple categories.</text></g>
    <g transform="translate(14 208)"><rect width="182" height="29" rx="3" fill="#eff6ff" stroke="#bfdbfe"/><rect width="48" height="29" rx="3" fill="#dbeafe"/><text x="7" y="11" font-size="6.5" font-weight="700" fill="#111827">L1</text><text x="7" y="20" font-size="4.4" fill="#374151">Repeatable</text><text x="56" y="10" font-size="5.2" font-weight="700" fill="#111827">40-55%</text><text x="56" y="18" font-size="4.3" fill="#374151">Some patterns repeat; governance is light.</text><text x="56" y="25" font-size="3.8" fill="#2563eb">Gate to L2: documented process and owned criteria.</text></g>
    <g transform="translate(14 172)"><rect width="182" height="29" rx="3" fill="#ecfdf5" stroke="#bbf7d0"/><rect width="62" height="29" rx="3" fill="#dcfce7"/><text x="7" y="11" font-size="6.5" font-weight="700" fill="#111827">L2</text><text x="7" y="20" font-size="4.4" fill="#374151">Defined</text><text x="70" y="10" font-size="5.2" font-weight="700" fill="#111827">55-65%</text><text x="70" y="18" font-size="4.3" fill="#374151">Rubric exists; teams can run the audit.</text><text x="70" y="25" font-size="3.8" fill="#047857">Gate to L3: measured, signed audit trail.</text></g>
    <g transform="translate(14 136)"><rect width="182" height="29" rx="3" fill="#f0fdfa" stroke="#99f6e4"/><rect width="78" height="29" rx="3" fill="#ccfbf1"/><text x="7" y="11" font-size="6.5" font-weight="700" fill="#111827">L3</text><text x="7" y="20" font-size="4.4" fill="#374151">Managed</text><text x="86" y="10" font-size="5.2" font-weight="700" fill="#111827">65-75%</text><text x="86" y="18" font-size="4.3" fill="#374151">Evidence-backed; public self-audit cap.</text><text x="86" y="25" font-size="3.8" fill="#0f766e">Gate to L4: third-party verification.</text></g>
    <g transform="translate(14 100)"><rect width="182" height="29" rx="3" fill="#fffbeb" stroke="#fde68a"/><rect width="96" height="29" rx="3" fill="#fef3c7"/><text x="7" y="11" font-size="6.5" font-weight="700" fill="#111827">L4</text><text x="7" y="20" font-size="4.4" fill="#374151">Managed-advanced</text><text x="104" y="10" font-size="5.2" font-weight="700" fill="#111827">75-85%</text><text x="104" y="18" font-size="4.3" fill="#374151">External review; enterprise gates hold.</text><text x="104" y="25" font-size="3.8" fill="#b45309">Gate to L5: repeated audits and ecosystem proof.</text></g>
    <g transform="translate(14 64)"><rect width="182" height="29" rx="3" fill="#fff7ed" stroke="#fed7aa"/><rect width="116" height="29" rx="3" fill="#f97316"/><text x="7" y="11" font-size="6.5" font-weight="700" fill="#fff">L5</text><text x="7" y="20" font-size="4.4" fill="#fff">Optimised</text><text x="124" y="10" font-size="5.2" font-weight="700" fill="#111827">85%+</text><text x="124" y="18" font-size="4.3" fill="#374151">Verified, resilient, externally proven.</text><text x="124" y="25" font-size="3.8" fill="#c2410c">Gate stays high: no self-attested L5.</text></g>
  </g>
  <path d="M105 228L105 203M105 192L105 167M105 156L105 131M105 120L105 95" stroke="#9ca3af" stroke-width=".9" stroke-dasharray="2 2"/>
  <text x="14" y="287" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="3.8" fill="#6b7280">DSAF v1, 2026-05-18 - audit.cyberskill.world - self-audits cite L3 max until third-party verification.</text>
</svg>
