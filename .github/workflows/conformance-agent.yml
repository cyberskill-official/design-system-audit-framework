name: DSAF Conformance Agent

on:
  pull_request:
    paths:
      - "framework/**"
      - "internal/**"
      - "package.json"
      - "README.md"
      - ".github/workflows/conformance-agent.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run verify
