name: DSAF Conformance Agent

# Path filters previously watched "framework/**" and "internal/**", which do not
# exist (the repo uses docs/framework and docs/internal) — the verify gate never
# fired on PRs. Filters now match the real tree, plus push-to-main and manual runs.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/framework/**"
      - "docs/guidelines/**"
      - "docs/internal/**"
      - "scripts/**"
      - "packages/**"
      - "package.json"
      - "README.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/conformance-agent.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run verify
