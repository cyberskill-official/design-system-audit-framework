name: Storybook Addon CI

on:
  pull_request:
    paths:
      - "packages/storybook-addon/**"
      - "scripts/checks/check-*.mjs"
      - "scripts/bin/storybook-addon-runner.mjs"
      - ".github/workflows/storybook-addon-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - run: npm --prefix packages/storybook-addon test
      - run: npm --prefix packages/storybook-addon run smoke
      - run: npm run integ:storybook
