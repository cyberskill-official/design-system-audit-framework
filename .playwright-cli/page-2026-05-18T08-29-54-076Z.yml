  - 'heading "A1.1: Color tokens are governance, not naming decoration" [level=1] [ref=e6]'
  - paragraph [ref=e7]:
    - strong [ref=e8]: "Canonical URL:"
    - code [ref=e9]: https://audit.cyberskill.world/blog/deep-dives/week-01-a1-1-color-tokens
  - paragraph [ref=e10]:
    - strong [ref=e11]: "DSAF criterion:"
    - code [ref=e12]: A1.1
    - text: — Color tokens with primitive → semantic → component layers
  - paragraph [ref=e13]:
    - strong [ref=e14]: "Tag:"
    - code [ref=e15]: FIXED
  - paragraph [ref=e16]:
    - strong [ref=e17]: "Reading time:"
    - text: ~7 minutes
  - heading "The criterion (quoted verbatim)" [level=2] [ref=e18]
  - paragraph [ref=e19]: "```"
  - paragraph [ref=e20]: A1.1 — Color tokens with primitive to semantic to component layers
  - paragraph [ref=e21]: 0 = Absent No tokens exist; colours are hex codes embedded in stylesheets.
  - paragraph [ref=e22]: 1 = Mentioned A "tokens" file exists but it's a flat list of hex values, no layering.
  - paragraph [ref=e23]:
    - text: 2 = Defined A primitive layer is named (e.g.
    - code [ref=e24]: blue-500
    - text: ) but no semantic layer above it.
  - paragraph [ref=e25]:
    - text: 3 = Built Primitive + semantic layers exist (e.g.
    - code [ref=e26]: blue-500
    - text: →
    - code [ref=e27]: color-action-primary
    - text: );
  - paragraph [ref=e28]: consumers reference the semantic name, not the primitive.
  - paragraph [ref=e29]: 4 = Measured Three-layer architecture (primitive → semantic → component-scoped); the
  - paragraph [ref=e30]: component layer is generated, not hand-maintained; coverage is tracked.
  - paragraph [ref=e31]: 5 = Industry-leading Three-layer + modern colour spaces (OKLCH / P3) + automated contrast math
  - paragraph [ref=e32]: baked into token generation + multi-mode (light / dark / high-contrast)
  - paragraph [ref=e33]: compiles from the same primitive set.
  - paragraph [ref=e34]: "```"
  - heading "Why this matters" [level=2] [ref=e35]
  - paragraph [ref=e36]:
    - text: Most design systems treat color tokens as a naming convention. The team renames
    - code [ref=e37]: "#0066cc"
    - text: to
    - code [ref=e38]: blue-500
    - text: ", adds it to a"
    - code [ref=e39]: tokens.json
    - text: file, and considers tokens "done." Six months later the same hex value is referenced inline in fourteen places, three of them with subtly-different shades that nobody can explain.
  - paragraph [ref=e40]:
    - text: The problem isn't the naming. The problem is that flat tokens — primitive-only — push every consumer to make a semantic decision at the point of use. "Should this button be
    - code [ref=e41]: blue-500
    - text: or
    - code [ref=e42]: blue-600
    - text: "?\" is an aesthetic question dressed up as a technical one, and the answer drifts. Each team's interpretation of the system gets a little further from the source until you have de-facto forks that nobody intended."
  - paragraph [ref=e43]:
    - text: The three-layer architecture exists to push semantic decisions back into the system. A primitive (
    - code [ref=e44]: blue-500
    - text: ) is a hex value with a name. A semantic token (
    - code [ref=e45]: color-action-primary
    - text: ) is a *decision* — "the system has decided that primary action elements use this colour, and consumers should not relitigate that decision per-component." A component-scoped token (
    - code [ref=e46]: button-primary-background
    - text: ") is the last refinement: the system can change the button's specific shade without changing every other action element."
  - paragraph [ref=e47]: When a team takes this criterion seriously, three things change. First, design reviews stop arguing about specific hex values — they argue about whether a new use-case needs a new semantic token, which is the right level for the argument. Second, dark mode and high-contrast mode become tractable, because the primitive layer can swap and the semantic layer rebinds automatically. Third, accessibility audits get faster, because contrast guarantees live in the token math (criterion A8.1) rather than per-component.
  - paragraph [ref=e48]:
    - text: The criterion is
    - code [ref=e49]: FIXED
    - text: because the layering either exists in the codebase or it doesn't — there's no version of the world where "we use primitive → semantic tokens" requires re-scoring quarterly. The standards around colour spaces (OKLCH / P3 at the 5/5 level) are
    - code [ref=e50]: DYNAMIC
    - text: ", but they sit on top of this row in A1.9."
  - heading "What good looks like" [level=2] [ref=e51]
  - paragraph [ref=e52]:
    - link "Adobe Spectrum" [ref=e53] [cursor=pointer]:
      - /url: https://spectrum.adobe.com/page/color-system/
    - text: ships the three-layer architecture as a public reference. The primitive layer is the
    - link "global colour palette" [ref=e54] [cursor=pointer]:
      - /url: https://spectrum.adobe.com/page/color-palette/
    - text: —
    - code [ref=e55]: blue-400
    - text: through
    - code [ref=e56]: blue-1400
    - text: ", named by lightness. The semantic layer is the"
    - link "alias system" [ref=e57] [cursor=pointer]:
      - /url: https://spectrum.adobe.com/page/color/
    - text: —
    - code [ref=e58]: accent-color-default
    - text: ","
    - code [ref=e59]: informative-color-default
    - text: ","
    - code [ref=e60]: notice-color-default
    - text: ". The component layer is private: each Spectrum component ("
    - code [ref=e61]: sp-button
    - text: ","
    - code [ref=e62]: sp-alert
    - text: ) references the semantic alias, never the primitive.
  - paragraph [ref=e63]: "What's working in this example:"
  - list [ref=e64]:
    - listitem [ref=e65]:
      - text: A designer cannot reach for
      - code [ref=e66]: blue-700
      - text: directly when designing a new component. The only public surface is the semantic alias, which forces them to either reuse an existing decision or propose a new alias via the system's RFC process (criterion A4.2).
    - listitem [ref=e67]: Dark mode is a primitive-layer swap. The semantic aliases re-resolve to different primitives in dark mode; no per-component overrides are needed.
    - listitem [ref=e68]: High-contrast mode (which Spectrum ships as a third theme) reuses the same alias names with a different primitive map. The component layer is unchanged.
    - listitem [ref=e69]: Modern colour spaces (OKLCH at the primitive level) are present — Spectrum's primitives are authored in a perceptual colour space, which makes contrast math at A8.1 directly computable.
  - paragraph [ref=e70]: That last point is what pushes Spectrum to 5/5 on A1.1, not just 4/5. A team can ship a perfectly clean three-layer architecture in plain sRGB and score 4/5; the 5/5 anchor requires the modern colour-space treatment that makes downstream criteria (contrast, theming) easier to satisfy.
  - heading "The anti-pattern" [level=2] [ref=e71]
  - paragraph [ref=e72]:
    - text: A design system at scale, six months into its first version. The
    - code [ref=e73]: tokens.json
    - text: "file looks like this:"
  - paragraph [ref=e74]: "```json"
  - paragraph [ref=e75]: "{"
  - paragraph [ref=e76]: "\"color\": {"
  - paragraph [ref=e77]: "\"primary\": { \"$value\": \"#0066cc\" },"
  - paragraph [ref=e78]: "\"primary-dark\": { \"$value\": \"#004499\" },"
  - paragraph [ref=e79]: "\"primary-light\": { \"$value\": \"#3399ff\" },"
  - paragraph [ref=e80]: "\"secondary\": { \"$value\": \"#ff6600\" },"
  - paragraph [ref=e81]: "\"neutral-100\": { \"$value\": \"#f7f7f7\" },"
  - paragraph [ref=e82]: "\"neutral-900\": { \"$value\": \"#111111\" }"
  - paragraph [ref=e83]: "}"
  - paragraph [ref=e84]: "}"
  - paragraph [ref=e85]: "```"
  - paragraph [ref=e86]: "A component uses the token correctly:"
  - paragraph [ref=e87]: "```css"
  - paragraph [ref=e88]: ".Button--primary {"
  - paragraph [ref=e89]: "background-color: var(--color-primary);"
  - paragraph [ref=e90]: "color: var(--color-neutral-100);"
  - paragraph [ref=e91]: "}"
  - paragraph [ref=e92]: "```"
  - paragraph [ref=e93]: "This scores 1/5 on A1.1, sometimes 2/5 if the team has been disciplined. Here's why it fails:"
  - paragraph [ref=e94]:
    - text: The token names look semantic (
    - code [ref=e95]: primary
    - text: ","
    - code [ref=e96]: secondary
    - text: ) but they're operating as primitives. There's no layer between "this hex value" and "this UI role." A second team building a
    - code [ref=e97]: Toast
    - text: "component faces the choice: use"
    - code [ref=e98]: color-primary
    - text: (already chosen for buttons; visually wrong for toasts) or hard-code a new hex value (breaks the token discipline) or invent
    - code [ref=e99]: color-toast-background
    - text: (the right answer — but the system gave them no place to put it).
  - paragraph [ref=e100]:
    - text: What teams typically do in this anti-pattern is invent the missing layer ad-hoc. Buttons stay on
    - code [ref=e101]: color-primary
    - text: . The
    - code [ref=e102]: Toast
    - text: team adds
    - code [ref=e103]: "--color-toast-background: #fff8e1"
    - text: inline. The
    - code [ref=e104]: Alert
    - text: team copies that approach with their own hex. Three months later there are forty inline hex values scattered through the components, and the
    - code [ref=e105]: tokens.json
    - text: file is decorative.
  - paragraph [ref=e106]:
    - text: The recovery path is not "rename everything." It's "add the missing semantic layer above the existing tokens and treat the existing tokens as the primitive layer going forward." Rename
    - code [ref=e107]: color-primary
    - text: to
    - code [ref=e108]: blue-500
    - text: in the primitives file, add a new
    - code [ref=e109]: color-action-primary
    - text: semantic alias that points to it, and migrate one component at a time. The system moves from 1/5 to 3/5 the moment any one component switches from the primitive to the semantic alias.
  - heading "Checklist" [level=2] [ref=e110]
  - list [ref=e111]:
    - listitem [ref=e112]: "[ ] Every shipped component references a semantic token, never a primitive directly"
    - listitem [ref=e113]:
      - text: "[ ] The semantic layer has a documented naming convention (e.g."
      - code [ref=e114]: "color-{role}-{intent}-{state}"
      - text: )
    - listitem [ref=e115]: "[ ] Dark mode and high-contrast mode are primitive-layer swaps, not per-component overrides"
    - listitem [ref=e116]:
      - text: "[ ] At least one component-scoped token exists for a component with mode-specific tuning needs (e.g."
      - code [ref=e117]: button-primary-background-hover
      - text: )
    - listitem [ref=e118]:
      - text: "[ ] The token files are DTCG-formatted ("
      - code [ref=e119]: $value
      - text: ","
      - code [ref=e120]: $type
      - text: ) — required for A1.8 conformance
    - listitem [ref=e121]: "[ ] A linter or CI check rejects PRs that introduce inline hex values in component CSS"
    - listitem [ref=e122]: "[ ] The primitives use a modern colour space (OKLCH / P3) for at least the brand-critical hues — required for the 5/5 anchor"
  - paragraph [ref=e123]: A team scoring 7/7 on the checklist is at 5/5 on the rubric. A team scoring 3–4 / 7 is at 3/5 (built but not measured). A team scoring 0–2 / 7 is at 0–1 (no real token discipline yet).
