    - listitem [ref=e133]:
      - code [ref=e134]: A6.1
      - text: — Light + dark mode parity. Becomes tractable only when A1.1 is at 3/5+.
    - listitem [ref=e135]:
      - code [ref=e136]: A8.1
      - text: — Contrast guarantees. Bakes into token math only when the primitives are perceptual-colour-space-authored (the 5/5 anchor here).
  - heading "What this post does NOT say" [level=2] [ref=e137]
  - list [ref=e138]:
    - listitem [ref=e139]:
      - text: This is
      - strong [ref=e140]: not
      - text: a token-naming-convention guide. The names matter less than the layering. A team can ship
      - code [ref=e141]: "--color-stp-primary-bg-default"
      - text: and score 5/5 if the *layers* are right.
    - listitem [ref=e142]:
      - text: This is
      - strong [ref=e143]: not
      - text: advocacy for a specific token format. DTCG is the format the rubric reaches for (A1.8) but the layering structure is format-agnostic.
    - listitem [ref=e144]:
      - text: This is
      - strong [ref=e145]: not
      - text: Style Dictionary marketing. Style Dictionary is one way to build the three layers; Tokens Studio is another; hand-authored layers are a third. The criterion measures the architecture, not the tooling.
