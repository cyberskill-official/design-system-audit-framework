<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSAF-25 Product Hunt preview</title>
  <style>
    body { margin: 0; width: 1200px; height: 750px; background: #f8fafc; color: #111827; font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif; }
    main { box-sizing: border-box; width: 100%; height: 100%; padding: 48px; display: grid; grid-template-columns: 380px 1fr; gap: 40px; align-items: center; }
    h1 { margin: 0 0 18px; font-size: 58px; line-height: 1; letter-spacing: 0; }
    p { margin: 0 0 24px; color: #334155; font-size: 24px; line-height: 1.35; }
    .metric { display: grid; gap: 12px; margin-top: 34px; }
    .pill { width: fit-content; border: 1px solid #cbd5e1; border-radius: 999px; padding: 9px 14px; font-size: 18px; font-weight: 700; background: #ffffff; }
    .card { height: 654px; display: grid; place-items: center; background: #ffffff; border: 1px solid #d1d5db; }
    img { height: 620px; width: auto; display: block; }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>DSAF-25 Core</h1>
      <p>A one-page entry point into the full 125-criterion audit rubric.</p>
      <p>Score 25 rows from 0-5, then map the result to DSAF Levels.</p>
      <div class="metric">
        <span class="pill">25 criteria</span>
        <span class="pill">20 categories represented</span>
        <span class="pill">5-minute read</span>
      </div>
    </section>
    <section class="card">
      <img src="../dsaf-25-card.svg" alt="DSAF-25 Core card">
    </section>
  </main>
</body>
</html>
